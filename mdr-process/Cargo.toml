[package]
name = "mdr-process"
version = "0.41.3"
edition = "2024"

[dependencies]
molly = "0.7"
anyhow = "1.0.100"
sha2 = "0.11"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1.4.0"
diesel = { version = "2.2", features = ["postgres"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
libmdrepo = { path = "../libmdrepo" }
mdr-db = { path = "../mdr-db" }
log = "0.4.29"
num_cpus = "1.17.0"
pdbrust = { version = "0.7.1", features = ["filter"] }
rayon = "1.12.0"
regex = "1.12.3"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11"
strum = "0.28"
strum_macros = "0.28"
toml = "1"
validator = { version = "0.21.0", features = ["derive"] }
which = "8.0.0"

[dev-dependencies]
tempfile = "3"
tar = "0.4"
assert_cmd = "2.1.2"
